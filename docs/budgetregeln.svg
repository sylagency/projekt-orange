<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>Wann das Paid-Budget gestoppt und weitergegeben wird</title>
  <desc>Nach jedem Spitzentag wird die Ampel geprüft. Grün zweimal: hochfahren. Orange: halten oder reduzieren, zweimal steigend: stoppen. Rot einmal: stoppen. Bei einem Stopp wandert das Budget die Substitutionskette entlang bis zum ersten grünen Ort. Der Stopp gilt, bis der Ort zweimal grün ist.</desc>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#706E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="640" fill="#FFFFFF"/>
  <g fill="none" stroke="#706E59" stroke-width="1.2" marker-end="url(#pfeil)">
    <path d="M340 76 L340 98 L130 98 L130 118"/>
    <path d="M340 76 L340 118"/>
    <path d="M340 98 L550 98 L550 118"/>
    <path d="M340 176 L340 208"/>
    <path d="M340 266 L340 308"/>
    <path d="M550 176 L550 338 L432 338"/>
    <path d="M340 366 L340 408"/>
    <path d="M340 466 L340 508"/>
  </g>
  <g text-anchor="middle">
    <rect x="230" y="20" width="220" height="56" rx="2" fill="#ECECE8" stroke="#C0BEB2"/>
    <text x="340" y="43" font-size="14" font-weight="bold" fill="#706E59">Nach jedem Spitzentag</text>
    <text x="340" y="63" font-size="12" fill="#817E65">Ampel des Ortes prüfen</text>

    <rect x="40" y="120" width="180" height="56" rx="2" fill="#EBF5EA" stroke="#3D9B35"/>
    <text x="130" y="143" font-size="14" font-weight="bold" fill="#348B2F">Grün</text>
    <text x="130" y="163" font-size="12" fill="#348B2F">2× grün: Paid hochfahren</text>

    <rect x="250" y="120" width="180" height="56" rx="2" fill="#FFEDC3" stroke="#DA8E03"/>
    <text x="340" y="143" font-size="14" font-weight="bold" fill="#8A5A00">Orange</text>
    <text x="340" y="163" font-size="12" fill="#8A5A00">halten oder reduzieren</text>

    <rect x="460" y="120" width="180" height="56" rx="2" fill="#FBE5E7" stroke="#C60219"/>
    <text x="550" y="143" font-size="14" font-weight="bold" fill="#AF0E1B">Rot (schon 1×)</text>
    <text x="550" y="163" font-size="12" fill="#AF0E1B">Paid sofort stoppen</text>

    <rect x="250" y="210" width="180" height="56" rx="2" fill="#FFEDC3" stroke="#DA8E03"/>
    <text x="340" y="233" font-size="14" font-weight="bold" fill="#8A5A00">2× orange steigend</text>
    <text x="340" y="253" font-size="12" fill="#8A5A00">Paid stoppen</text>

    <rect x="250" y="310" width="180" height="56" rx="2" fill="#FBE5E7" stroke="#C60219"/>
    <text x="340" y="333" font-size="14" font-weight="bold" fill="#AF0E1B">Paid gestoppt</text>
    <text x="340" y="353" font-size="12" fill="#AF0E1B">Budget wird frei</text>

    <rect x="200" y="410" width="280" height="56" rx="2" fill="#EAF7FA" stroke="#2D9DB4"/>
    <text x="340" y="433" font-size="14" font-weight="bold" fill="#1F6F80">Budget wandert die Kette entlang</text>
    <text x="340" y="453" font-size="12" fill="#1F6F80">erster grüner Ort erhält 3/4</text>

    <rect x="200" y="510" width="280" height="56" rx="2" fill="#ECECE8" stroke="#C0BEB2"/>
    <text x="340" y="533" font-size="14" font-weight="bold" fill="#706E59">Stopp gilt, bis Ort 2× grün</text>
    <text x="340" y="553" font-size="12" fill="#817E65">dann zuerst halbes, später volles Budget</text>
  </g>
  <text x="40" y="600" font-size="12" fill="#817E65">Ist kein Ort der Kette grün, wird nichts umgeleitet. Owned pausiert nur bei Rot</text>
  <text x="40" y="618" font-size="12" fill="#817E65">und läuft wieder, sobald der Ort wieder orange ist.</text>
</svg>
